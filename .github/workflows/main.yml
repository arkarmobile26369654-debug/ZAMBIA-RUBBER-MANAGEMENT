name: Build ZAMBIA RUBBER APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract Android project
    run: |
      mkdir project
      unzip ZAMBIA-RUBBER-ANDROID-PROJECT.zip -d project

  - name: Build APK
    run: |
      cd project/ZAMBIA-RUBBER-ANDROID
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: ZAMBIA-RUBBER-APK
      path: project/ZAMBIA-RUBBER-ANDROID/app/build/outputs/apk/debug/app-debug.
