name: Build Zambia Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: unzip -o ZAMBIA-RUBBER-ANDROID-PROJECT.zip -d .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p ZAMBIA-RUBBER-ANDROID assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAMBIA-RUBBER-APK
          path: ZAMBIA-RUBBER-ANDROID/app/build/outputs/apk/debug/*.apk
